{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-end mb-8">
    <div>
        <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Suppliers</h1>
        <p class="text-slate-500 mt-1">Manage hospital vendors.</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Add Supplier Form -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h3 class="font-bold text-slate-800 mb-4">Add New Supplier</h3>
        <form action="/suppliers/add" method="POST">
            <label class="block text-sm font-medium text-slate-700 mb-1">Supplier Name</label>
            <input type="text" name="name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500">
            
            <label class="block text-sm font-medium text-slate-700 mb-1">Contact Details</label>
            <input type="text" name="contact" class="w-full px-3 py-2 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500">
            
            <label class="block text-sm font-medium text-slate-700 mb-1">Lead Time (Days)</label>
            <input type="number" name="lead_time" value="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg mb-6 focus:ring-2 focus:ring-blue-500">
            
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors">Add Supplier</button>
        </form>
    </div>

    <!-- Supplier List -->
    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Supplier</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Stock Value</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                {% for s in suppliers %}
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <p class="font-bold text-slate-800">{{ s.name }}</p>
                        <p class="text-xs text-slate-500">{{ s.contact }} • {{ s.lead_time }} days lead time</p>
                    </td>
                    <td class="px-6 py-4 font-medium text-emerald-600">${{ '%.2f'|format(s.stock_val) }}</td>
                    <td class="px-6 py-4 flex gap-2">
                        <a href="/supplier/{{ s.id }}" class="text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded transition-colors">Manage</a>
                        <a href="/suppliers/delete/{{ s.id }}" onclick="return confirm('Delete this supplier? Medicines will be unlinked.')" class="text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded transition-colors">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
