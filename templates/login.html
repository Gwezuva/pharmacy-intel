<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Makumbe District Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 h-screen flex">

    <!-- Left Side: Branding (Hidden on mobile) -->
    <div class="hidden lg:flex w-1/2 bg-blue-600 text-white flex-col justify-center items-center p-12 relative overflow-hidden">
        <!-- Decorative Circles -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500 rounded-full opacity-50 blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-700 rounded-full opacity-50 blur-3xl"></div>
        
        <div class="relative z-10 text-center">
            <i class="fa-solid fa-hospital text-6xl mb-6"></i>
            <h1 class="text-4xl font-bold mb-4 tracking-tight">Makumbe District Hospital</h1>
            <p class="text-blue-100 text-lg max-w-md">Pharmacy Intelligence & Point of Sale System. Manage stock, predict demand, and serve patients efficiently.</p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-slate-800">Welcome Back</h2>
                <p class="text-slate-500 mt-2">Please sign in to your account</p>
            </div>

            {% if error %}
            <div class="bg-red-50 text-red-600 p-4 rounded-lg mb-6 text-sm flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <input type="text" name="username" required placeholder="admin" 
                            class="w-full pl-11 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-slate-50 focus:bg-white">
                    </div>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" name="password" required placeholder="••••••••" 
                            class="w-full pl-11 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-slate-50 focus:bg-white">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-lg transition-colors shadow-lg shadow-blue-200">
                    Sign In
                </button>
            </form>

        </div>
    </div>
</body>
</html>
